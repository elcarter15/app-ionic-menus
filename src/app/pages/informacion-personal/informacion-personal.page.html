<!-- src/app/pages/informacion-personal/informacion-personal.page.html -->
<!-- Autor: Yimi J. Cardozo R. -->
<!-- Descripción: Página de información personal con estilo similar a Contacto -->

<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Información personal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="contenido-informacion">
    
    <!-- Avatar igual que en Contacto -->
    <ion-avatar class="avatar">
      <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Avatar">
    </ion-avatar>
    
    <h2>Mis Datos Personales</h2>
    <p>Completa tu información</p>
    
    <!-- Formulario con el mismo estilo que la lista de contacto -->
    <ion-list class="formulario-lista">
      
      <!-- Campo Nombre -->
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label position="stacked">Nombre completo</ion-label>
        <ion-input [(ngModel)]="nombre" placeholder="Escribe tu nombre"></ion-input>
      </ion-item>
      
      <!-- Campo Edad -->
      <ion-item>
        <ion-icon name="calendar-outline" slot="start" color="secondary"></ion-icon>
        <ion-label position="stacked">Edad</ion-label>
        <ion-input type="number" [(ngModel)]="edad" placeholder="Tu edad"></ion-input>
      </ion-item>
      
      <!-- Campo Correo -->
      <ion-item>
        <ion-icon name="mail-outline" slot="start" color="tertiary"></ion-icon>
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input type="email" [(ngModel)]="correo" placeholder="correo@ejemplo.com"></ion-input>
      </ion-item>
      
    </ion-list>

    <!-- Botón Guardar (igual que en Contacto) -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Guardar información</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" (click)="guardarInformacion()" color="primary">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Guardar datos
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Tarjeta para mostrar información guardada -->
    <ion-card *ngIf="mostrarDatosGuardados" class="info-guardada">
      <ion-card-header>
        <ion-card-title>✅ Información guardada</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list class="datos-guardados">
          <ion-item lines="none">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-label><strong>Nombre:</strong> {{ nombreGuardado }}</ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-icon name="calendar-outline" slot="start" color="secondary"></ion-icon>
            <ion-label><strong>Edad:</strong> {{ edadGuardado }}</ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-icon name="mail-outline" slot="start" color="tertiary"></ion-icon>
            <ion-label><strong>Correo:</strong> {{ correoGuardado }}</ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
